<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>EpicSpire RMS</title>
    <link rel="icon" href="/icon.ico" sizes="any" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="application-name" content="EpicSpire RMS" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EpicSpire RMS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <script>
      // Apply saved theme before paint to avoid light flash in dark mode
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark') {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {}
      // Browser default zoom 67% (Electron uses webContents zoomFactor — skip there)
      try {
        if (!/Electron/i.test(navigator.userAgent || '')) {
          var DEFAULT_APP_ZOOM = 0.67
          document.documentElement.style.zoom = String(DEFAULT_APP_ZOOM)
          window.__APP_ZOOM__ = DEFAULT_APP_ZOOM
          window.__setAppZoom = function (next) {
            var n = Number(next)
            if (!Number.isFinite(n) || n < 0.5 || n > 3) return
            document.documentElement.style.zoom = String(n)
            window.__APP_ZOOM__ = n
          }
          window.addEventListener('keydown', function (ev) {
            if (!(ev.ctrlKey || ev.metaKey) || ev.altKey) return
            var cur = Number(window.__APP_ZOOM__ || DEFAULT_APP_ZOOM) || DEFAULT_APP_ZOOM
            if (ev.key === '0') {
              ev.preventDefault()
              window.__setAppZoom(DEFAULT_APP_ZOOM)
            } else if (ev.key === '=' || ev.key === '+') {
              ev.preventDefault()
              window.__setAppZoom(Math.min(3, Math.round((cur + 0.05) * 100) / 100))
            } else if (ev.key === '-' || ev.key === '_') {
              ev.preventDefault()
              window.__setAppZoom(Math.max(0.5, Math.round((cur - 0.05) * 100) / 100))
            }
          }, { capture: true })
        }
      } catch (eZoom) {}
      // Network-only SW — required for Chrome "Install app" prompt. No caching.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {})
        })
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="text-slate-900 dark:text-slate-100 font-medium">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
