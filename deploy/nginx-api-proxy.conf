# Put this inside the HTTPS server { } for forksnknives.epicspire.com,
# ABOVE any try_files / static SPA location.
#
#   sudo nginx -t && sudo systemctl reload nginx
#   pm2 status   # Node API must listen on 127.0.0.1:5000
#
# Verify:
#   curl -s https://forksnknives.epicspire.com/api/health
#   → {"ok":true,...}   (NOT <!doctype html>)

location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_request_headers on;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    client_max_body_size 100m;
}
